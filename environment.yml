# conda env for video-annotation (exported from Oscar, RTX 3090, CUDA 12.8 wheels).
# Install (sam2 needs torch at build time, so it goes in after the env):
#   conda env create -f environment.yml && conda run -n annotation env SAM2_BUILD_CUDA=0 \
#     pip install --no-build-isolation "git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"
name: annotation
channels:
  - conda-forge
dependencies:
  - python=3.11.18
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - accelerate==1.15.0
      - annotated-doc==0.0.5
